name: Update public game build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public play repository
        uses: actions/checkout@v4

      - name: Download latest compiled game
        run: |
          rm -rf site game.zip
          mkdir -p site
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b9d8-820e-b4a9-83db121432ae/raw?se=2026-11-08T16%3A01%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=1953e956-89bf-556e-8099-14ab526aa707&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T23%3A35%3A22Z&ske=2026-11-08T23%3A35%3A22Z&sks=b&skv=2026-02-06&sig=Y6Dx6mNE/xCPBBYgTw8hbm%2BbziTK4bcmEMKdt%2B8n1FU%3D' -o game.zip
          unzip -q game.zip -d site
          test -f site/index.html

      - name: Replace public build
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -R site/. .
          rm -rf site game.zip
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish latest Nina game build" || exit 0
          git push
