name: Publish compiled Nina game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public play repository
        uses: actions/checkout@v4

      - name: Download compiled game
        run: |
          rm -rf site game.zip
          mkdir -p site
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b1ac-820e-b9dd-0c768c383dd9/raw?se=2026-11-08T13%3A57%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=b53bdd6e-6b3d-5a45-a815-d7f65b102704&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-08T12%3A57%3A17Z&ske=2026-11-09T12%3A57%3A17Z&sks=b&skv=2026-02-06&sig=uqxV2lmuK71rIJdVbGa/I6NCsA%2BFW%2B5tepxftzR5UhQ%3D' -o game.zip
          unzip -q game.zip -d site
          test -f site/index.html

      - name: Publish compiled files to repository
        run: |
          rm -rf assets index.html
          cp -R site/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git commit -m "Publish compiled game" || exit 0
          git push
